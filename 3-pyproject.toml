[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haunted-shell"
version = "0.1.0"
description = "A tiny local ghost that whispers about your shell commands (offline, open-weight model)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.optional-dependencies]
local = ["llama-cpp-python>=0.2.90"]

[project.scripts]
haunt = "haunted_shell.cli:main"

[tool.setuptools.packages.find]
include = ["haunted_shell*"]
